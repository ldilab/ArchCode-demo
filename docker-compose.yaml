version: "3.9"

services:
  # Docker daemon (DinD) - 내부 전용
  dind:
    image: docker:24-dind
    container_name: archcode-dind
    privileged: true
    networks:
      - archcode-net
    environment:
      # TLS 비활성 (내부 네트워크 한정 사용)
      - DOCKER_TLS_CERTDIR=
    command: [ "dockerd", "-H", "tcp://0.0.0.0:2375", "-H", "unix:///var/run/docker.sock" ]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/_ping | grep -q OK || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  exec:
    build:
      context: .
      dockerfile: Dockerfile.exec
    container_name: archcode-exec
    networks:
      - archcode-net
    environment:
      # exec 내부에서 docker CLI가 DinD로 붙도록
      - DOCKER_HOST=tcp://dind:2375
    depends_on:
      dind:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5097/health || curl -fsS http://127.0.0.1:5097/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: archcode-server
    ports:
      - "8005:8005"
    networks:
      - archcode-net
    environment:
      # exec의 HTTP 엔드포인트(코드 실행 API)는 그대로 5097
      - CODEEXEC_ENDPOINT=http://exec:5097
    depends_on:
      exec:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8005/health || curl -fsS http://localhost:8005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: archcode-demo
    ports:
      - "5173:5173"   # 외부 노출 유일 포트
    networks:
      - archcode-net
    environment:
      - VITE_API_URL=http://ldi.snu.ac.kr:8005
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  archcode-net:
    driver: bridge
